name: Publish AuronQ Mobile 0.4.2 Alpha

on:
  push:
    branches: [main]
    paths:
      - '.release/android-0.4.2'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Test AuronQ Go code
        run: |
          go test ./...
          go vet ./...

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK/NDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Install gomobile
        run: |
          go get golang.org/x/mobile@latest
          go get -tool golang.org/x/mobile/cmd/gobind@latest
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Build AuronQ Go bridge AAR
        run: |
          mkdir -p android/app/libs
          gomobile bind -target=android/arm64 -androidapi 26 -javapkg com.auronq.mobilebind -o android/app/libs/auronqmobile.aar ./mobile/bridge

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Android APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk AuronQ-Mobile-0.4.2-alpha.apk
          sha256sum AuronQ-Mobile-0.4.2-alpha.apk > AuronQ-Mobile-0.4.2-SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AuronQ-Mobile-0.4.2-alpha
          path: |
            AuronQ-Mobile-0.4.2-alpha.apk
            AuronQ-Mobile-0.4.2-SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v0.4.2-alpha
          target_commitish: main
          name: AuronQ Mobile 0.4.2 Alpha
          prerelease: true
          make_latest: false
          body: |
            AuronQ Mobile 0.4.2 Alpha.

            Changes:
            - compares Mainnet state across multiple replaceable HTTPS AuronQ nodes instead of silently trusting one node;
            - groups exact height/tip/chain-work observations and exposes peer agreement in the UI;
            - prefers multi-peer agreement over a lone endpoint claiming much greater work;
            - compares wallet balances only across peers that report the same chain state and fails closed if same-chain peers disagree;
            - broadcasts the same locally signed transaction directly to multiple reachable AuronQ nodes;
            - remembers peers learned from native AuronQ P2P gossip;
            - bundled bootstrap addresses are replaceable rendezvous hints and the GitHub manifest remains optional freshness metadata;
            - private keys and ML-DSA-87 signing remain local on the phone.

            AuronQ Mobile is still a light wallet client, not a full node. Multi-peer agreement reduces single-endpoint dependence but is not equivalent to independently validating the complete AQM64 header/block chain.

            This is a debug-signed alpha APK and has not received an independent security audit. Do not use substantial value.
          files: |
            AuronQ-Mobile-0.4.2-alpha.apk
            AuronQ-Mobile-0.4.2-SHA256SUMS.txt
