name: Refresh AuronQ public peer registry

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cmd/auronq-peer-crawler/**'
      - '.github/workflows/peer-registry.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auronq-peer-registry
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Test crawler package
        run: go test ./cmd/auronq-peer-crawler

      - name: Crawl verified public AuronQ peers
        run: go run ./cmd/auronq-peer-crawler -manifest bootstrap.json -mirror bootstrap.mainnet.json

      - name: Verify generated registry coherence
        run: go run ./cmd/auronq-healthcheck -manifest bootstrap.json

      - name: Prepare registry update branch
        id: registry
        shell: bash
        run: |
          if git diff --quiet -- bootstrap.json bootstrap.mainnet.json; then
            echo "No bootstrap changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          branch="automation/peer-registry"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add bootstrap.json bootstrap.mainnet.json
          git commit -m "Refresh verified AuronQ public peers"
          git push --force origin "HEAD:$branch"

      - name: Open or update protected-main pull request
        if: steps.registry.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          existing="$(gh pr list --head automation/peer-registry --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Updated existing peer-registry PR #$existing"
            exit 0
          fi

          set +e
          output="$(gh pr create \
            --base main \
            --head automation/peer-registry \
            --title "Refresh verified AuronQ public peers" \
            --body "Automated peer-registry refresh. The crawler includes only reachable peers that report the AuronQ Mainnet Network ID. This PR intentionally goes through the protected main branch and normal CI before merge." 2>&1)"
          rc=$?
          set -e

          if [ "$rc" -eq 0 ]; then
            echo "$output"
            exit 0
          fi

          if grep -q "GitHub Actions is not permitted to create or approve pull requests" <<<"$output"; then
            echo "::warning::Live peer registry published to automation/peer-registry; repository settings block only the optional reviewed-main PR."
            {
              echo "### Peer registry update ready for review"
              echo
              echo "The crawler published the live supplemental registry on `automation/peer-registry` after network-health verification."
              echo "Fresh nodes that include the live-registry manifest can use it immediately. Repository policy blocks only the optional static snapshot PR."
              echo "Create a protected-main PR from `automation/peer-registry` when convenient."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "$output" >&2
          exit "$rc"
