name: Refresh AuronQ public peer registry

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cmd/auronq-peer-crawler/**'
      - '.github/workflows/peer-registry.yml'
      - '.github/workflows/peer-registry-validation.yml'

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: auronq-peer-registry
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Test crawler package
        run: go test ./cmd/auronq-peer-crawler

      - name: Crawl verified public AuronQ peers
        run: go run ./cmd/auronq-peer-crawler -manifest bootstrap.json -mirror bootstrap.mainnet.json

      - name: Verify generated registry coherence
        run: go run ./cmd/auronq-healthcheck -manifest bootstrap.json -min-healthy 3 -min-netgroups 3

      - name: Prepare registry update branch
        id: registry
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- bootstrap.json bootstrap.mainnet.json; then
            echo "No bootstrap changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          branch="automation/peer-registry"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add bootstrap.json bootstrap.mainnet.json
          git commit -m "Refresh verified AuronQ public peers"
          git push --force origin "HEAD:$branch"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open or update protected-main pull request
        if: steps.registry.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh pr list --head automation/peer-registry --base main --state open --json number --jq '.[0].number // empty')"

          if [ -n "$existing" ]; then
            echo "Using existing peer-registry PR #$existing"
            echo "number=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          output="$(gh pr create             --base main             --head automation/peer-registry             --title "Refresh verified AuronQ public peers"             --body "Automated peer-registry refresh. The crawler includes only reachable peers that report the AuronQ Mainnet Network ID. The update is validated by dedicated CI, the frozen-Mainnet guard and public network health before automatic squash merge." 2>&1)"
          rc=$?
          set -e

          if [ "$rc" -ne 0 ]; then
            if grep -Fq "GitHub Actions is not permitted to create or approve pull requests" <<<"$output"; then
              echo "::error::Repository setting blocks GitHub Actions from creating pull requests. Enable Settings > Actions > General > Workflow permissions > Allow GitHub Actions to create and approve pull requests."
              exit 1
            fi
            echo "$output" >&2
            exit "$rc"
          fi

          number="$(gh pr list --head automation/peer-registry --base main --state open --json number --jq '.[0].number')"
          echo "Opened peer-registry PR #$number"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Dispatch protected validation
        if: steps.registry.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/peer-registry"
          gh workflow run peer-registry-validation.yml --ref "$branch"
          gh workflow run frozen-mainnet-gate.yml --ref "$branch"
          gh workflow run network-health.yml --ref "$branch"

      - name: Wait for validation workflows
        if: steps.registry.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.registry.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          wait_for_run() {
            workflow="$1"
            run_id=""

            for _ in $(seq 1 30); do
              run_id="$(gh run list                 --workflow "$workflow"                 --branch automation/peer-registry                 --event workflow_dispatch                 --limit 20                 --json databaseId,headSha                 --jq ".[] | select(.headSha == \"$HEAD_SHA\") | .databaseId" | head -n1)"
              if [ -n "$run_id" ]; then
                break
              fi
              sleep 2
            done

            if [ -z "$run_id" ]; then
              echo "::error::Could not locate dispatched $workflow run for $HEAD_SHA"
              return 1
            fi

            echo "Waiting for $workflow run $run_id"
            gh run watch "$run_id" --exit-status
          }

          wait_for_run peer-registry-validation.yml
          wait_for_run frozen-mainnet-gate.yml
          wait_for_run network-health.yml

      - name: Squash merge verified registry update
        if: steps.registry.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --squash --delete-branch             --subject "network: refresh verified public peer registry"             --body "Automated verified peer-registry refresh. Consensus and Mainnet identity unchanged."
