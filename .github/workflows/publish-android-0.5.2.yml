name: Publish AuronQ Mobile 0.5.2 Alpha

on:
  push:
    branches: [main]
    paths:
      - '.release/android-0.5.2'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
    steps:
      - uses: actions/checkout@v4

      - name: Verify release source versions
        shell: bash
        run: |
          grep -F "versionName '0.5.2-alpha'" android/app/build.gradle
          grep -F 'mobileVersion       = "0.5.2-alpha"' mobile/bridge/bridge.go
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Test AuronQ Go code
        run: |
          go test ./...
          go vet ./...

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK/NDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Install gomobile
        run: |
          go get golang.org/x/mobile@latest
          go get -tool golang.org/x/mobile/cmd/gobind@latest
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Build AuronQ Go bridge AAR
        run: |
          mkdir -p android/app/libs
          gomobile bind -target=android/arm64 -androidapi 26 -javapkg com.auronq.mobilebind -o android/app/libs/auronqmobile.aar ./mobile/bridge

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Android APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk AuronQ-Mobile-0.5.2-alpha.apk
          sha256sum AuronQ-Mobile-0.5.2-alpha.apk > AuronQ-Mobile-0.5.2-SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AuronQ-Mobile-0.5.2-alpha
          path: |
            AuronQ-Mobile-0.5.2-alpha.apk
            AuronQ-Mobile-0.5.2-SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v0.5.2-alpha
          target_commitish: main
          name: AuronQ Mobile 0.5.2 Alpha
          prerelease: true
          make_latest: false
          body: |
            AuronQ Mobile 0.5.2 Alpha.

            Connection reliability fixes:
            - temporary peer/header timeouts no longer erase a valid locally verified header cache;
            - a lagging peer no longer forces an expensive AQM64 replay from genesis;
            - full header-cache replay is reserved for a confirmed same-height history mismatch/reorg;
            - mobile peer probing returns promptly after a valid AuronQ Mainnet peer answers, with a short grace window for additional peer agreement;
            - the optional GitHub bootstrap manifest is not retried when a bundled/learned Mainnet peer is already reachable;
            - the UI shows the independently verified network snapshot immediately instead of waiting for slower wallet balance/history quorum requests.

            Security model is unchanged: the app independently verifies Mainnet headers, AQM64 PoW, difficulty, timestamps and hash continuity, then uses agreeing verified-chain peers for wallet state.

            AuronQ Mobile is a light client, not a full node. This is a debug-signed alpha APK and has not received an independent security audit. Do not use substantial value.

            No Mainnet consensus, Network ID, genesis, PoW, transaction or monetary changes.
          files: |
            AuronQ-Mobile-0.5.2-alpha.apk
            AuronQ-Mobile-0.5.2-SHA256SUMS.txt
