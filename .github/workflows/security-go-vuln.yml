name: AuronQ security — Go vulnerability scan

on:
  schedule:
    - cron: '17 4 * * 1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/security-go-vuln.yml'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    paths:
      - '.github/workflows/security-go-vuln.yml'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-vulnerability-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Inspect dependencies for reachable known vulnerabilities
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
