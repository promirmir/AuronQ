name: Import AuronQ 1.7.0 source

on:
  push:
    branches: [main]
    paths:
      - 'AuronQ-1.7.0-GitHub-source.zip'
      - '.github/workflows/import-source.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source archive
        run: |
          rm -rf .import
          mkdir .import
          unzip -q AuronQ-1.7.0-GitHub-source.zip -d .import
          rsync -a --exclude='.git' --exclude='.github/workflows' .import/ ./
          rm -rf .import
      - name: Commit source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Import exact AuronQ 1.7.0 mainnet source"
          git push
