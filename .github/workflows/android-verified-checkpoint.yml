name: Generate reviewed Android header checkpoint

on:
  push:
    branches: [fix/android-checkpoint-fast-sync-20261010]
    paths:
      - '.github/workflows/android-verified-checkpoint.yml'
      - 'mobile/bridge/checkpoint_generate_test.go'

permissions:
  contents: write

jobs:
  verify-and-write:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Verify historical AQM64 chain once and cross-check peers
        run: |
          cd mobile/bridge
          AURONQ_GENERATE_CHECKPOINT=1 go test -timeout 48m -run '^TestGenerateReviewedMobileCheckpoint$' -count=1 -v
      - name: Commit checked point to review branch
        run: |
          test -s mobile/bridge/verified-checkpoint.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/bridge/verified-checkpoint.json
          git commit -m "chore(android): pin independently reverified header checkpoint"
          git push
