name: Publish AuronQ Full Node 1.7.14 P2P Checkpoints

# Build and publish only after an explicit release decision.
# Merging code to main NEVER upgrades live nodes or publishes a Mainnet binary.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auronq-node-1.7.14-release
  cancel-in-progress: false

jobs:
  safety:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Require current main and unchanged frozen consensus implementation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          BASE=c1001ee2950158781f216820cc5e4911aa0044a9
          git cat-file -e "$BASE^{commit}"
          # Only peer-service changes are allowed after the audited PR #145.
          changed="$(git diff --name-only "$BASE" HEAD -- internal/auronq)"
          while IFS= read -r file; do
            case "$file" in
              ""|internal/auronq/node.go|internal/auronq/p2p_checkpoint_test.go) ;;
              *) echo "Consensus-package change blocks node release: $file"; exit 1;;
            esac
          done <<< "$changed"
          git diff --exit-code "$BASE" HEAD -- network.json bootstrap.json
          echo "Frozen Mainnet identity and blockchain validation code unchanged."

      - name: Fail closed on version or protocol identity drift
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'const version = "1.7.14"' cmd/auronq/main.go
          grep -Fq 'const desktopVersion = "1.7.14"' cmd/auronq-desktop/main.go
          go test ./internal/auronq -run '^TestMainnetIdentityIsFrozen$' -count=1
          go test ./internal/auronq -run '^TestP2PSignedCheckpoint|^TestP2PCheckpoint|^TestNetworkContinuesAfterOriginalSeedNodesDisappear$' -count=1 -timeout=10m
          go test ./...
          go vet ./...
          go test -race ./internal/auronq -run '^TestP2P' -count=1 -timeout=8m

  windows:
    needs: safety
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $env:CGO_ENABLED="0"
          go build -trimpath -buildvcs=false -ldflags="-s -w -buildid= -H=windowsgui" -o AuronQ-Desktop.exe ./cmd/auronq-desktop
          if ($LASTEXITCODE -ne 0) { throw "desktop build failed" }
          go build -trimpath -buildvcs=false -ldflags="-s -w -buildid=" -o auronq-cli.exe ./cmd/auronq
          if ($LASTEXITCODE -ne 0) { throw "cli build failed" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item AuronQ-Desktop.exe,auronq-cli.exe,network.json,bootstrap.json,README-WINDOWS.md,START-AURONQ.cmd,START-PUBLIC-NODE.cmd,START-SEED-NODE.cmd dist\
          Get-FileHash dist\AuronQ-Desktop.exe -Algorithm SHA256 | Format-List | Out-File dist\SHA256SUMS-Windows.txt
          Get-FileHash dist\auronq-cli.exe -Algorithm SHA256 | Format-List | Out-File -Append dist\SHA256SUMS-Windows.txt
          Compress-Archive -Path dist\* -DestinationPath AuronQ-1.7.14-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: auronq-p2p-windows
          path: AuronQ-1.7.14-Windows-x64.zip

  linux:
    needs: safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags="-s -w -buildid=" -o auronq ./cmd/auronq
          mkdir -p dist
          cp auronq network.json bootstrap.json README.md MAINNET.md dist/
          sha256sum dist/auronq > dist/SHA256SUMS-Linux.txt
          tar -C dist -czf AuronQ-1.7.14-Linux-amd64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: auronq-p2p-linux
          path: AuronQ-1.7.14-Linux-amd64.tar.gz

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish immutable full-node binaries only after safety checks
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          test -s AuronQ-1.7.14-Windows-x64.zip
          test -s AuronQ-1.7.14-Linux-amd64.tar.gz
          sha256sum AuronQ-1.7.14-Windows-x64.zip AuronQ-1.7.14-Linux-amd64.tar.gz > SHA256SUMS.txt
          if gh release view v1.7.14 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists. Refusing to overwrite immutable binaries."
            exit 0
          fi
          gh release create v1.7.14 \
            AuronQ-1.7.14-Windows-x64.zip \
            AuronQ-1.7.14-Linux-amd64.tar.gz \
            SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "AuronQ v1.7.14 — independent P2P checkpoints" \
            --notes "Optional non-consensus full-node canary update. P2P checkpoint service is DISABLED BY DEFAULT. Node operators can pilot it with AURONQ_ENABLE_P2P_CHECKPOINTS=1 after copying node data and checking status. When enabled, a validating node signs advisory checkpoints every 256 validated blocks. P2P checkpoint traffic is separately rate-limited and cannot starve block submissions. HTTP GET /p2p/checkpoint serves the signed hint without GitHub or any shared signing key. Signature identifies the issuing peer; it DOES NOT prove historic consensus or authorize fast-sync state, balance or payments. Genesis, Network ID, AQM64, difficulty, emission and wallet/UTXO rules are unchanged. Existing Mainnet nodes remain protocol compatible. Updated binaries must be deployed by each node operator; GitHub release alone does not upgrade live peers. Back up node data and stop the process before a binary replacement. Released only after explicit manual dispatch and Mainnet identity, consensus-file, Go/race and cross-platform build gates. Canary first; avoid upgrading all nodes at once. Full independent security audit is pending." \
            --prerelease
