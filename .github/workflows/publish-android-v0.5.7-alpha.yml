name: Publish Android v0.5.7 Alpha

on:
  # Historical 0.5.7 release is already published. Do not rerun its
  # version-pinned acceptance gate on newer Android source PRs.
  push:
    branches: [main]
    paths:
      - '.release/android-0.5.7'
      - '.github/workflows/publish-android-v0.5.7-alpha.yml'

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
  RELEASE_TAG: android-v0.5.7-alpha-runtime-independence

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Verify source and Go code
        run: |
          set -euo pipefail
          grep -Fq "versionCode 12" android/app/build.gradle
          grep -Fq "versionName '0.5.7-alpha'" android/app/build.gradle
          grep -Fq "runtime057" android/app/build.gradle
          grep -Fq "confirmPasswordInput" android/app/src/main/java/com/auronq/mobile/MainActivity.java
          grep -Fq "Passwords do not match" android/app/src/main/java/com/auronq/mobile/MainActivity.java
          go test ./...
          go vet ./...
          go test ./internal/auronq -run '^TestMainnetIdentityIsFrozen$' -count=1 -timeout=4m
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK and NDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Build Go mobile bridge
        run: |
          set -euo pipefail
          go get golang.org/x/mobile@latest
          go get -tool golang.org/x/mobile/cmd/gobind@latest
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android/arm64 -androidapi 26 -javapkg com.auronq.mobilebind -o android/app/libs/auronqmobile.aar ./mobile/bridge
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build side-by-side 0.5.7 APK
        working-directory: android
        run: gradle --no-daemon :app:assembleRuntime057
      - name: Verify and stage APK
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/runtime057/app-runtime057.apk"
          test -s "$APK"
          mkdir -p release
          cp "$APK" release/AuronQ-Mobile-0.5.7-Alpha-Runtime-Independence.apk
          cd release
          sha256sum AuronQ-Mobile-0.5.7-Alpha-Runtime-Independence.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish Android prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG"             release/AuronQ-Mobile-0.5.7-Alpha-Runtime-Independence.apk             release/SHA256SUMS.txt             --target "$GITHUB_SHA"             --title "AuronQ Mobile 0.5.7 Alpha — Runtime Independence"             --prerelease             --notes "Android 0.5.7 Alpha packages the reviewed GitHub-independent peer discovery/failover work and restores two-field wallet password confirmation with a 12-character minimum before wallet creation. It installs side by side as com.auronq.mobile.runtime057 because CI debug signing cannot safely guarantee in-place upgrades over older funded wallet apps. Back up and verify recovery before migration; never uninstall a funded wallet as an update workaround. Android remains a light client, not a full validating node. Mainnet consensus, Network ID, genesis, AQM64, wallet cryptographic format and transaction rules are unchanged. Not independently audited."
