name: Publish AuronQ Mobile 0.5.3 Alpha

on:
  push:
    branches: [main]
    paths:
      - '.release/android-0.5.3'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
    steps:
      - uses: actions/checkout@v4

      - name: Verify release source versions
        shell: bash
        run: |
          grep -F "versionName '0.5.3-alpha'" android/app/build.gradle
          grep -F 'mobileVersion       = "0.5.3-alpha"' mobile/bridge/bridge.go
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Test AuronQ Go code
        run: |
          go test ./...
          go vet ./...

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK/NDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Install gomobile
        run: |
          go get golang.org/x/mobile@latest
          go get -tool golang.org/x/mobile/cmd/gobind@latest
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Build AuronQ Go bridge AAR
        run: |
          mkdir -p android/app/libs
          gomobile bind -target=android/arm64 -androidapi 26 -javapkg com.auronq.mobilebind -o android/app/libs/auronqmobile.aar ./mobile/bridge

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Android APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk AuronQ-Mobile-0.5.3-alpha.apk
          sha256sum AuronQ-Mobile-0.5.3-alpha.apk > AuronQ-Mobile-0.5.3-SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AuronQ-Mobile-0.5.3-alpha
          path: |
            AuronQ-Mobile-0.5.3-alpha.apk
            AuronQ-Mobile-0.5.3-SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v0.5.3-alpha
          target_commitish: main
          name: AuronQ Mobile 0.5.3 Alpha
          prerelease: true
          make_latest: false
          body: |
            AuronQ Mobile 0.5.3 Alpha.

            Fresh-install and connection resilience improvements:
            - fresh installs can use the full currently verified public peer set, including direct public IPv4 full nodes;
            - cleartext transport is accepted only for literal globally routable IP peers; private, loopback, CGNAT and documentation ranges are rejected, while DNS peers still require HTTPS;
            - the three newly crawler-verified public IPv4 Mainnet peers are bundled as direct fallbacks;
            - first launch clearly explains that local AQM64 header verification from genesis can take longer;
            - verified header progress is persisted after each successful batch so interrupted first sync can resume instead of restarting from genesis;
            - the app shows that the network is reachable while local verification is still running;
            - transient refresh errors no longer erase an already verified state or immediately flip the UI back to Offline.

            Security model is unchanged: AuronQ Mobile independently verifies Mainnet headers, AQM64 PoW, difficulty, timestamps and hash continuity, then uses agreeing verified-chain peers for wallet state.

            AuronQ Mobile is a light client, not a full node. This is a debug-signed alpha APK and has not received an independent security audit. Do not use substantial value.

            No Mainnet consensus, Network ID, genesis, PoW, transaction or monetary changes.
          files: |
            AuronQ-Mobile-0.5.3-alpha.apk
            AuronQ-Mobile-0.5.3-SHA256SUMS.txt
