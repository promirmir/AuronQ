name: Publish GPU Miner v0.3.7-alpha

on:
  push:
    branches:
      - main
    paths:
      - '.release/gpu-miner-v0.3.7-alpha'

permissions:
  contents: write

env:
  GPU_VERSION: 0.3.7-alpha
  GPU_TAG: gpu-v0.3.7-alpha
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '13.2.0'
          method: network
          use-github-cache: 'true'

      - name: Build CUDA backend
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\gpu\cuda\build-windows.ps1

      - name: Build Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = Join-Path $PWD "dist\AuronQ-GPU-Miner-v$env:GPU_VERSION"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          go build -trimpath -o (Join-Path $dist "auronq-gpu-worker.exe") .\cmd\auronq-gpu-miner
          if ($LASTEXITCODE -ne 0) { throw "GPU worker build failed" }

          go build -trimpath -ldflags "-H=windowsgui" -o (Join-Path $dist "AuronQ-GPU-Miner.exe") .\cmd\auronq-gpu-miner-gui
          if ($LASTEXITCODE -ne 0) { throw "GUI build failed" }

          Copy-Item .\gpu\cuda\auronq-aqm64-cuda.dll $dist -Force
          Copy-Item .\network.json $dist -Force
          Copy-Item .\bootstrap.json $dist -Force
          Copy-Item .\gpu\cuda\README.md (Join-Path $dist "README-GPU-MINER.md") -Force
          Copy-Item .\GPU-MINER-GUIDE.md $dist -Force
          if (Test-Path .\LICENSE) { Copy-Item .\LICENSE $dist -Force }

          $gui = Join-Path $dist "AuronQ-GPU-Miner.exe"
          $worker = Join-Path $dist "auronq-gpu-worker.exe"
          if (!(Test-Path $gui)) { throw "GUI missing" }
          if (!(Test-Path $worker)) { throw "worker missing" }
          if ((Get-FileHash $gui -Algorithm SHA256).Hash -eq (Get-FileHash $worker -Algorithm SHA256).Hash) { throw "GUI and worker are identical - refusing release" }

          $zip = Join-Path $PWD "dist\AuronQ-GPU-Miner-v$env:GPU_VERSION-Windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $dist "*") -DestinationPath $zip -CompressionLevel Optimal

      - uses: actions/upload-artifact@v4
        with:
          name: gpu-miner-windows
          path: dist/AuronQ-GPU-Miner-v0.3.7-alpha-Windows-x64.zip
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '13.2.0'
          method: network
          use-github-cache: 'true'

      - name: Build Linux amd64 package
        shell: bash
        run: |
          bash ./build-gpu-miner-linux.sh "$GPU_VERSION"
          test -f "dist/AuronQ-GPU-Miner-v$GPU_VERSION-Linux-amd64.tar.gz"
          file "dist/AuronQ-GPU-Miner-v$GPU_VERSION-Linux-amd64/auronq-gpu-miner"
          file "dist/AuronQ-GPU-Miner-v$GPU_VERSION-Linux-amd64/libauronq-aqm64-cuda.so"

      - uses: actions/upload-artifact@v4
        with:
          name: gpu-miner-linux
          path: dist/AuronQ-GPU-Miner-v0.3.7-alpha-Linux-amd64.tar.gz
          if-no-files-found: error

  publish:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify and checksum packages
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          test -f "AuronQ-GPU-Miner-v$GPU_VERSION-Windows-x64.zip"
          test -f "AuronQ-GPU-Miner-v$GPU_VERSION-Linux-amd64.tar.gz"
          sha256sum             "AuronQ-GPU-Miner-v$GPU_VERSION-Windows-x64.zip"             "AuronQ-GPU-Miner-v$GPU_VERSION-Linux-amd64.tar.gz"             > SHA256SUMS-GPU-MINER.txt
          cat SHA256SUMS-GPU-MINER.txt

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(
            "dist/AuronQ-GPU-Miner-v$GPU_VERSION-Windows-x64.zip"
            "dist/AuronQ-GPU-Miner-v$GPU_VERSION-Linux-amd64.tar.gz"
            "dist/SHA256SUMS-GPU-MINER.txt"
          )
          if gh release view "$GPU_TAG" >/dev/null 2>&1; then
            gh release upload "$GPU_TAG" "${assets[@]}" --clobber
          else
            gh release create "$GPU_TAG" "${assets[@]}"               --target "$GITHUB_SHA"               --title "AuronQ GPU Miner v0.3.7 Alpha"               --notes-file "./GPU-MINER-RELEASE-NOTES.md"               --prerelease
          fi
