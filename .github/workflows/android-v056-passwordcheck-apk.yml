name: AuronQ Android 0.5.6 password confirmation TEST APK

on:
  push:
    branches:
      - fix/android-v056-confirm-password-test-20261011
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
    steps:
      - uses: actions/checkout@v4
      - name: Confirm source is the tagged 0.5.6 release plus minimal wallet UI change
        run: |
          set -euo pipefail
          git fetch origin tag android-v0.5.6-alpha-fast-sync
          changed="$(git diff --name-only android-v0.5.6-alpha-fast-sync HEAD -- ':!.github/workflows/android-v056-passwordcheck-apk.yml')"
          echo "$changed"
          test "$changed" = "$(printf 'android/app/build.gradle\nandroid/app/src/main/java/com/auronq/mobile/MainActivity.java')"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Run Go tests
        run: go test ./...
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK/NDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Install Go mobile bridge
        run: |
          go get golang.org/x/mobile@latest
          go get -tool golang.org/x/mobile/cmd/gobind@latest
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
      - name: Build Go bridge AAR
        run: |
          mkdir -p android/app/libs
          gomobile bind -target=android/arm64 -androidapi 26 -javapkg com.auronq.mobilebind -o android/app/libs/auronqmobile.aar ./mobile/bridge
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build separate 0.5.6 test APK
        working-directory: android
        run: gradle --no-daemon :app:assemblePasswordcheck
      - name: Check APK exists
        run: |
          test -s android/app/build/outputs/apk/passwordcheck/app-passwordcheck.apk
          sha256sum android/app/build/outputs/apk/passwordcheck/app-passwordcheck.apk
      - name: Save exact APK
        uses: actions/upload-artifact@v4
        with:
          name: AuronQ-Mobile-0.5.6-Password-Test-APK
          path: android/app/build/outputs/apk/passwordcheck/app-passwordcheck.apk
          if-no-files-found: error
          retention-days: 14
