name: Publish AuronQ 1.7.3 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-1.7.3-once.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: go test -race ./...

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - shell: pwsh
        run: |
          $version = "1.7.3"
          $env:CGO_ENABLED="0"
          go build -trimpath -buildvcs=false -ldflags="-s -w -buildid= -H=windowsgui" -o AuronQ-Desktop.exe ./cmd/auronq-desktop
          go build -trimpath -buildvcs=false -ldflags="-s -w -buildid=" -o auronq-cli.exe ./cmd/auronq
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item AuronQ-Desktop.exe,auronq-cli.exe,network.json,bootstrap.json,README-WINDOWS.md,START-AURONQ.cmd,START-SEED-NODE.cmd dist\
          Get-FileHash dist\AuronQ-Desktop.exe -Algorithm SHA256 | Format-List | Out-File dist\SHA256SUMS-Windows.txt
          Get-FileHash dist\auronq-cli.exe -Algorithm SHA256 | Format-List | Out-File -Append dist\SHA256SUMS-Windows.txt
          Compress-Archive -Path dist\* -DestinationPath "AuronQ-$version-Windows-x64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: AuronQ-1.7.3-Windows-x64.zip

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - run: |
          VERSION="1.7.3"
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags="-s -w -buildid=" -o auronq ./cmd/auronq
          mkdir -p dist
          cp auronq network.json bootstrap.json README.md MAINNET.md dist/
          sha256sum dist/auronq > dist/SHA256SUMS-Linux.txt
          tar -C dist -czf "AuronQ-$VERSION-Linux-amd64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: AuronQ-1.7.3-Linux-amd64.tar.gz

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate release archive checksums
        run: |
          cd artifacts
          sha256sum AuronQ-1.7.3-Windows-x64.zip AuronQ-1.7.3-Linux-amd64.tar.gz > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.3
          target_commitish: ${{ github.sha }}
          name: AuronQ v1.7.3 Mainnet
          prerelease: false
          make_latest: true
          body: |
            AuronQ 1.7.3 Mainnet patch release.

            Fixes the Windows public seed launcher shipped in 1.7.2. START-SEED-NODE.cmd now correctly locates tailscale.exe, reads the device DNSName, configures Tailscale Funnel, and advertises the public HTTPS endpoint to AuronQ.

            Consensus, Network ID, genesis, PoW and transaction validation are unchanged.

            Security notice: AQM64 and the complete consensus/network implementation have not received an independent professional security or cryptographic audit.
          files: |
            artifacts/AuronQ-1.7.3-Windows-x64.zip
            artifacts/AuronQ-1.7.3-Linux-amd64.tar.gz
            artifacts/SHA256SUMS.txt
