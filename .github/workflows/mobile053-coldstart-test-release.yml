name: Build 0.5.3 fresh-install parallel AQM64 test APK

on:
  push:
    branches:
      - fix/mobile053-coldstart-parallel-verify-20261010
    paths:
      - '.github/workflows/mobile053-coldstart-test-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-build-publish-test:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Enforce original 0.5.3 consensus and wallet logic
        shell: bash
        run: |
          set -euo pipefail
          BASE=bfdc46bd91115ce8dc072b839845a135f3782f09
          git cat-file -e "$BASE^{commit}"
          git diff --exit-code "$BASE" HEAD -- \
            internal/auronq/ network.json genesis.json go.mod go.sum cmd/
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base='bfdc46bd91115ce8dc072b839845a135f3782f09'
          path='android/app/src/main/java/com/auronq/mobile/MainActivity.java'
          orig=subprocess.check_output(['git','show',f'{base}:{path}'],text=True)
          new=Path(path).read_text()
          start=new.index('    // A brand-new installation still verifies every AQM64 header')
          end=new.index('    @Override\n    protected void onResume()',start)
          new=new[:start]+new[end:]
          new=new.replace('import android.app.ActivityManager;\n','')
          new=new.replace('        configureFirstInstallVerification();\n','')
          new=new.replace('Bridge.quorumSnapshot(knownNodes, 0)',
                          'Bridge.quorumSnapshot(knownNodes, 1)')
          assert new==orig, 'Original 0.5.3 wallet UI was modified beyond cold-start performance'
          print('Original wallet UI/balance/history/send/receive identical to version 0.5.3')
          allowed={
             '.github/workflows/mobile053-fast-test-release.yml',
             '.github/workflows/mobile053-coldstart-test-release.yml',
             'android/app/build.gradle',
             'android/app/src/main/AndroidManifest.xml',
             'android/app/src/main/java/com/auronq/mobile/MainActivity.java',
             'android/app/src/main/java/com/auronq/mobile/HeaderConcurrencyPolicy.java',
             'android/verification/HeaderConcurrencyPolicySelfTest.java',
             'mobile/bridge/bridge.go',
             'mobile/bridge/fast053_snapshot_test.go',
             'mobile/bridge/fast053_verify.go',
             'mobile/bridge/fast053_verify_test.go'}
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          assert changed<=allowed, f'Unexpected source files: {changed-allowed}'
          print('Only approved 0.5.3 performance changes present.')
          PY
      - name: Verify original consensus checker and bounded memory
        shell: bash
        run: |
          set -euo pipefail
          go test ./mobile/bridge -run '^TestFast053' -count=1 -v
          go test -race ./mobile/bridge -run '^TestFast053' -count=1 -timeout=10m
          go test ./...
          go vet ./...
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Self-test Android first-run memory policy
        shell: bash
        run: |
          mkdir -p /tmp/auronq-java-tests
          javac -d /tmp/auronq-java-tests \
            android/app/src/main/java/com/auronq/mobile/HeaderConcurrencyPolicy.java \
            android/verification/HeaderConcurrencyPolicySelfTest.java
          java -cp /tmp/auronq-java-tests com.auronq.mobile.HeaderConcurrencyPolicySelfTest
      - name: Android SDK/NDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Build 0.5.3 Go wallet and verification binding
        run: |
          go get golang.org/x/mobile@latest
          go get -tool golang.org/x/mobile/cmd/gobind@latest
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android/arm64 -androidapi 26 -javapkg com.auronq.mobilebind -o android/app/libs/auronqmobile.aar ./mobile/bridge
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build isolated Android clean-install test
        working-directory: android
        run: gradle --no-daemon :app:assembleFast053parallel
      - name: Publish immutable isolated test APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/fast053parallel/app-fast053parallel.apk"
          test -s "$APK"
          cp "$APK" AuronQ-Mobile-0.5.3-Fresh-Install-Parallel-Test.apk
          sha256sum AuronQ-Mobile-0.5.3-Fresh-Install-Parallel-Test.apk > SHA256SUMS-Fresh-Install.txt
          TAG="android-v0.5.3-fresh-install-parallel-test-20261010"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Published test tag exists; refusing to overwrite."
            exit 1
          fi
          gh release create "$TAG" \
            AuronQ-Mobile-0.5.3-Fresh-Install-Parallel-Test.apk SHA256SUMS-Fresh-Install.txt \
            --target "$GITHUB_SHA" \
            --title "AuronQ 0.5.3 clean-install AQM64 parallel verifier TEST" \
            --notes "SAFE ISOLATED TEST ONLY. Derived from original verified 0.5.3 alpha. No trusted checkpoints or automatic signing authority: every header from genesis must still pass the same shared AQM64, difficulty, timestamp and previous hash consensus routine. On devices with >=3 GiB physical and >=768 MiB available RAM, at most two independent 64 MiB AQM64 validators work concurrently; lower-memory phones use original single worker. Original wallet balance/history/transactions and on-chain rules are unchanged. Testing from app install with no existing header cache is intentional, but first sync is still O(block height) and has not been benchmarked on your phone. Separate Android app ID: com.auronq.mobile.fast053parallel, never overwrites existing wallet. DO NOT uninstall funded wallets or import valuable wallet files into experiments. Debug-signed CI package is not an update of funded Android wallets."
            --prerelease
