name: Universal Miner accelerated CI

on:
  pull_request:
    paths:
      - 'cmd/auronq-gpu-miner/**'
      - 'cmd/auronq-gpu-miner-gui/**'
      - 'cmd/auronq/**'
      - 'gpu/cuda/**'
      - 'gpu/opencl/**'
      - 'internal/argon2pure/**'
      - 'internal/gputelemetry/**'
      - 'internal/auronq/node.go'
      - 'internal/auronq/upnp.go'
      - 'internal/auronq/*_test.go'
      - 'build-gpu-miner-windows.ps1'
      - 'build-gpu-miner-linux.sh'
      - 'network.json'
      - 'bootstrap.json'
      - '.github/workflows/gpu-miner-ci.yml'

permissions:
  contents: read

jobs:
  cuda-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile packaged Linux CUDA backend without requiring a GPU
        shell: bash
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            nvidia/cuda:13.2.0-devel-ubuntu24.04 \
            bash ./gpu/cuda/build-linux.sh
          test -f gpu/cuda/libauronq-aqm64-cuda.so
          file gpu/cuda/libauronq-aqm64-cuda.so

      - name: Compile legacy Maxwell Pascal Volta CUDA backend
        shell: bash
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            nvidia/cuda:12.6.3-devel-ubuntu24.04 \
            bash ./gpu/cuda/build-linux-legacy.sh
          test -f gpu/cuda/libauronq-aqm64-cuda-legacy.so
          file gpu/cuda/libauronq-aqm64-cuda-legacy.so

      - name: Compile vendor-neutral OpenCL backend without an OpenCL SDK
        shell: bash
        run: |
          bash ./gpu/opencl/build-linux.sh
          test -f gpu/opencl/libauronq-aqm64-opencl.so
          file gpu/opencl/libauronq-aqm64-opencl.so

  linux-app-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Test Linux miner code
        shell: bash
        run: |
          CGO_ENABLED=1 go test ./cmd/auronq-gpu-miner ./cmd/auronq

      - name: Build Linux miner without CUDA runtime present
        shell: bash
        run: |
          mkdir -p dist-ci
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -trimpath -o dist-ci/auronq-miner ./cmd/auronq-gpu-miner
          test -x dist-ci/auronq-miner
          file dist-ci/auronq-miner
          dist-ci/auronq-miner --backend cpu --cpu-threads 1 --self-test

      - name: Validate OpenCL kernel against canonical AQM64 through PoCL
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pocl-opencl-icd ocl-icd-libopencl1
          bash ./gpu/opencl/build-linux.sh
          test -f gpu/opencl/libauronq-aqm64-opencl.so
          AURONQ_OPENCL_TEST_ALL=1 dist-ci/auronq-miner \
            --backend opencl \
            --opencl-dll "$PWD/gpu/opencl/libauronq-aqm64-opencl.so" \
            --self-test

  windows-legacy-cuda-compile:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install CUDA 12.6 for legacy Maxwell Pascal Volta targets
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.6.3'
          method: network
          use-github-cache: 'true'
      - name: Compile Windows legacy CUDA backend
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\gpu\cuda\build-windows-legacy.ps1
          if (!(Test-Path .\gpu\cuda\auronq-aqm64-cuda-legacy.dll)) { throw "Legacy CUDA DLL missing" }

  windows-app-compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Test miner, node and UPnP runtime
        shell: pwsh
        run: |
          go test ./cmd/auronq-gpu-miner ./cmd/auronq-gpu-miner-gui ./cmd/auronq ./internal/argon2pure ./internal/gputelemetry ./internal/auronq

      - name: Compile Windows vendor-neutral OpenCL backend
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\gpu\opencl\build-windows.ps1
          if (!(Test-Path .\gpu\opencl\auronq-aqm64-opencl.dll)) { throw "OpenCL backend DLL missing" }

      - name: Build Windows CLI and Desktop-style GUI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-ci | Out-Null
          go build -trimpath -o dist-ci\auronq-miner-worker.exe .\cmd\auronq-gpu-miner
          go build -trimpath -ldflags "-H=windowsgui" -o dist-ci\AuronQ-Miner.exe .\cmd\auronq-gpu-miner-gui
          go build -trimpath -o dist-ci\auronq.exe .\cmd\auronq
          .\dist-ci\auronq-miner-worker.exe --backend cpu --cpu-threads 1 --self-test

      - name: Verify Windows package layout
        shell: pwsh
        run: |
          if (!(Test-Path .\dist-ci\AuronQ-Miner.exe)) { throw "GUI missing" }
          if (!(Test-Path .\dist-ci\auronq-miner-worker.exe)) { throw "worker missing" }
          if (!(Test-Path .\dist-ci\auronq.exe)) { throw "node CLI missing" }
          $gui = (Get-FileHash .\dist-ci\AuronQ-Miner.exe -Algorithm SHA256).Hash
          $worker = (Get-FileHash .\dist-ci\auronq-miner-worker.exe -Algorithm SHA256).Hash
          if ($gui -eq $worker) { throw "GUI and worker must be distinct binaries" }
          if (!(Test-Path .\network.json)) { throw "network.json missing" }
          if (!(Test-Path .\bootstrap.json)) { throw "bootstrap.json missing" }
