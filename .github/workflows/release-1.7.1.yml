name: Publish AuronQ 1.7.1

on:
  push:
    branches: [main]
    paths:
      - '.release/1.7.1'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: go test -race ./...

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - shell: pwsh
        run: |
          $env:CGO_ENABLED="0"
          go build -trimpath -buildvcs=false -ldflags="-s -w -buildid= -H=windowsgui" -o AuronQ-Desktop.exe ./cmd/auronq-desktop
          go build -trimpath -buildvcs=false -ldflags="-s -w -buildid=" -o auronq-cli.exe ./cmd/auronq
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item AuronQ-Desktop.exe,auronq-cli.exe,network.json,bootstrap.json,README-WINDOWS.md,START-AURONQ.cmd,START-SEED-NODE.cmd,CHANGES-1.7.1.txt dist\
          Get-FileHash dist\AuronQ-Desktop.exe -Algorithm SHA256 | Format-List | Out-File dist\SHA256SUMS-Windows.txt
          Get-FileHash dist\auronq-cli.exe -Algorithm SHA256 | Format-List | Out-File -Append dist\SHA256SUMS-Windows.txt
          Compress-Archive -Path dist\* -DestinationPath AuronQ-1.7.1-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: AuronQ-1.7.1-Windows-x64.zip

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - run: |
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags="-s -w -buildid=" -o auronq ./cmd/auronq
          mkdir -p dist
          cp auronq network.json bootstrap.json README.md MAINNET.md CHANGES-1.7.1.txt dist/
          sha256sum dist/auronq > dist/SHA256SUMS-Linux.txt
          tar -C dist -czf AuronQ-1.7.1-Linux-amd64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: AuronQ-1.7.1-Linux-amd64.tar.gz

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate release checksums
        run: |
          cd artifacts
          sha256sum AuronQ-1.7.1-Windows-x64.zip AuronQ-1.7.1-Linux-amd64.tar.gz > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.1
          target_commitish: main
          name: AuronQ 1.7.1 Mainnet
          prerelease: false
          make_latest: true
          body: |
            AuronQ 1.7.1 Mainnet.

            Changes:
            - safe wallet deletion in AuronQ Desktop;
            - explicit warning plus exact wallet-name confirmation;
            - deletion is restricted to the local AuronQ wallets directory;
            - deletion is blocked for the wallet currently used by the active miner;
            - no consensus, genesis, Network ID, monetary-policy or proof-of-work changes.

            Windows users: extract `AuronQ-1.7.1-Windows-x64.zip` and run `START-AURONQ.cmd`.

            Security notice: AQM64 and the complete consensus/network implementation have not received an independent professional security or cryptographic audit.
          files: |
            artifacts/AuronQ-1.7.1-Windows-x64.zip
            artifacts/AuronQ-1.7.1-Linux-amd64.tar.gz
            artifacts/SHA256SUMS.txt
