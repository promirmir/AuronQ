name: Build and publish AuronQ release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Verify release tag is current protected main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Verify source version matches tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          grep -Fq "const version = \"${VERSION}\"" cmd/auronq/main.go
          grep -Fq "const desktopVersion = \"${VERSION}\"" cmd/auronq-desktop/main.go

      - name: Verify frozen Mainnet identity
        run: go test ./internal/auronq -run '^TestMainnetIdentityIsFrozen
  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $env:CGO_ENABLED="0"
          go build -trimpath -buildvcs=false -ldflags="-s -w -buildid= -H=windowsgui" -o AuronQ-Desktop.exe ./cmd/auronq-desktop
          go build -trimpath -buildvcs=false -ldflags="-s -w -buildid=" -o auronq-cli.exe ./cmd/auronq
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item AuronQ-Desktop.exe,auronq-cli.exe,network.json,bootstrap.json,README-WINDOWS.md,START-AURONQ.cmd,START-PUBLIC-NODE.cmd,START-SEED-NODE.cmd dist\
          Get-FileHash dist\AuronQ-Desktop.exe -Algorithm SHA256 | Format-List | Out-File dist\SHA256SUMS-Windows.txt
          Get-FileHash dist\auronq-cli.exe -Algorithm SHA256 | Format-List | Out-File -Append dist\SHA256SUMS-Windows.txt
          Compress-Archive -Path dist\* -DestinationPath "AuronQ-$version-Windows-x64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: AuronQ-*-Windows-x64.zip

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags="-s -w -buildid=" -o auronq ./cmd/auronq
          mkdir -p dist
          cp auronq network.json bootstrap.json README.md MAINNET.md dist/
          sha256sum dist/auronq > dist/SHA256SUMS-Linux.txt
          tar -C dist -czf "AuronQ-$VERSION-Linux-amd64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: AuronQ-*-Linux-amd64.tar.gz

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate release archive checksums
        run: |
          cd artifacts
          sha256sum AuronQ-*-Windows-x64.zip AuronQ-*-Linux-amd64.tar.gz > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: AuronQ ${{ github.ref_name }} Mainnet
          prerelease: false
          make_latest: true
          body: |
            ## AuronQ Mainnet

            This is the current AuronQ Desktop / full-node Mainnet release. v1.7.13 hardens peer discovery against dead DNS endpoints and stale peer re-announcement.

            ### Windows
            Download the Windows x64 ZIP, verify its checksum, extract the entire archive and run `START-AURONQ.cmd`.

            ### Linux
            Download the Linux amd64 archive and verify the checksum published with this release.

            ### Network model
            AuronQ full nodes independently validate the canonical chain. Seed/bootstrap endpoints are replaceable first-contact hints and have no consensus privileges. Learned public peers are persisted and exchanged through native peer gossip.

            Every full node serves its own read-only blockchain Explorer from locally validated data.

            ### Identity
            Network ID: `44e62c2ace002a6660c14e252173c1aa303529c68e40c998e92da2b453f44f30b1e58c94d533587e2186004593fb856c433fcdb5418ed430ec8617e29529365c`

            Genesis: `5750a455c04bfe93c9edfef1a12744b05e29ac6da1a9dd5b790566629dea2080c581beb2f0324efba2067c9efb113ed7a29598fd3ffbed965ced31f265d0cec4`

            ### Security
            AQM64 and the complete consensus/network implementation have not received an independent professional security or cryptographic audit. Do not use substantial value.

            Full project history: https://github.com/promirmir/AuronQ/blob/main/CHANGELOG.md
          files: |
            artifacts/AuronQ-*-Windows-x64.zip
            artifacts/AuronQ-*-Linux-amd64.tar.gz
            artifacts/SHA256SUMS.txt
 -count=1

      - run: go test ./...
      - run: go vet ./...
      - run: go test -race ./...

