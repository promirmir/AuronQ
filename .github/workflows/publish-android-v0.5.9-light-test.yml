name: Publish Android v0.5.9 Alpha Light TEST

on:
  pull_request:
    paths:
      - '.github/workflows/publish-android-v0.5.9-light-test.yml'
  push:
    branches: [main]
    paths:
      - '.release/android-0.5.9-test'
      - '.github/workflows/publish-android-v0.5.9-light-test.yml'

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
  RELEASE_TAG: android-v0.5.9-alpha-light-test

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Test light wallet and immutable Mainnet
        run: |
          set -euo pipefail
          grep -Fq "versionCode 14" android/app/build.gradle
          grep -Fq "versionName '0.5.9-alpha'" android/app/build.gradle
          grep -Fq "light059" android/app/build.gradle
          grep -Fq 'Bridge.fastBalanceOnObservedChain' android/app/src/main/java/com/auronq/mobile/MainActivity.java
          grep -Fq 'Bridge.sendMultiLight' android/app/src/main/java/com/auronq/mobile/MainActivity.java
          grep -Fq 'android:icon="@drawable/ic_auronq"' android/app/src/main/AndroidManifest.xml
          go test ./...
          go vet ./...
          go test ./internal/auronq -run '^TestMainnetIdentityIsFrozen$' -count=1 -timeout=4m
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK and NDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Build Go mobile bridge
        run: |
          set -euo pipefail
          go get golang.org/x/mobile@latest
          go get -tool golang.org/x/mobile/cmd/gobind@latest
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android/arm64 -androidapi 26 -javapkg com.auronq.mobilebind -o android/app/libs/auronqmobile.aar ./mobile/bridge
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build isolated Android test APK
        working-directory: android
        run: gradle --no-daemon :app:assembleLight059
      - name: Check output and create checksums
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/light059/app-light059.apk"
          test -s "$APK"
          mkdir -p release
          cp "$APK" release/AuronQ-Mobile-0.5.9-Alpha-Light-TEST.apk
          cd release
          sha256sum AuronQ-Mobile-0.5.9-Alpha-Light-TEST.apk > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Upload review build
        uses: actions/upload-artifact@v4
        with:
          name: AuronQ-Mobile-0.5.9-Alpha-Light-TEST
          path: |
            release/AuronQ-Mobile-0.5.9-Alpha-Light-TEST.apk
            release/SHA256SUMS.txt
          retention-days: 14
      - name: Publish public, clearly labelled prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: refusing to replace it" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            release/AuronQ-Mobile-0.5.9-Alpha-Light-TEST.apk \
            release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "AuronQ Mobile 0.5.9 Alpha — Light TEST (fast startup)" \
            --prerelease \
            --notes "PUBLIC TEST ONLY — not independently validated on a phone, not professionally security-audited. The mobile interface starts without replaying AQM64 headers or waiting hours for synchronization. Balance requires matching peer-reported responses from three public IPv4 /16 network groups; it is NOT independently verified cryptographic consensus or trustless SPV. The light send path uses matching peer-reported UTXOs and locally signs transactions, but does NOT prove complete/correct UTXO state or independently verify PoW. Do not use this alpha test for valuable funds. The APK has an isolated application ID (com.auronq.mobile.light059) and debug signature, so it installs alongside older versions and does NOT import or replace their wallets. Never delete an existing funded wallet to migrate. Always keep and verify offline wallet backups. No change to AuronQ Mainnet consensus or keys."
