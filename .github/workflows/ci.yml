name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race ./...

      - name: Mainnet safety gate
        if: runner.os == 'Linux'
        run: |
          go test ./internal/auronq -run '^(TestMainnetIdentityIsFrozen|TestDifficultyAdjustmentClampsOneBlockJumps|TestBlockRejectsMedianTimePastAndFutureTimestamp|TestCoinbaseMaturityBoundary|TestNetworkContinuesAfterOriginalSeedNodesDisappear|TestTwentyNodeMultiPartitionConvergence)      - name: Build CLI
        run: go build -trimpath ./cmd/auronq
      - name: Build Desktop
        if: runner.os == 'Windows'
        run: go build -trimpath -ldflags="-H=windowsgui" ./cmd/auronq-desktop
 -count=1 -timeout=12m
      - name: Build CLI
        run: go build -trimpath ./cmd/auronq
      - name: Build Desktop
        if: runner.os == 'Windows'
        run: go build -trimpath -ldflags="-H=windowsgui" ./cmd/auronq-desktop
