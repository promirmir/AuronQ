name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # On pull requests, newer commits supersede older checks.
  # On main, every pushed commit must finish so GitHub does not show
  # a misleading red/cancelled status for the repository head.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      # Keep the other platform running even if one platform fails so the
      # commit status shows the real failure instead of a secondary cancel.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Mainnet safety gate
        if: runner.os == 'Linux'
        run: |
          go test ./internal/auronq -run '^(TestMainnetIdentityIsFrozen|TestDifficultyAdjustmentClampsOneBlockJumps|TestBlockRejectsMedianTimePastAndFutureTimestamp|TestCoinbaseMaturityBoundary|TestNetworkContinuesAfterOriginalSeedNodesDisappear|TestTwentyNodeMultiPartitionConvergence)$' -count=1 -timeout=12m
      - name: Build CLI
        run: go build -trimpath ./cmd/auronq
      - name: Build Desktop
        if: runner.os == 'Windows'
        run: go build -trimpath -ldflags="-H=windowsgui" ./cmd/auronq-desktop
