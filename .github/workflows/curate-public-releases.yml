# Retired destructive workflow (12 October 2026).
# The previous version could delete public GitHub Releases and contained a
# stale three-release allowlist. See this file's git history for the record.
# All historical releases/tags must be preserved; no automation may delete them.
name: Retired release cleanup — safe record only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm cleanup is permanently disabled by project policy
        run: |
          echo "Destructive release cleanup is retired."
          echo "Never delete or overwrite published assets/tags."
          echo "See PROJECT-STATUS.md and GitHub immutable-release settings."
