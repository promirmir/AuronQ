name: Publish AuronQ Mobile 0.1.0 Alpha

on:
  push:
    branches: [main]
    paths:
      - '.release/android-0.1.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Test AuronQ Go code
        run: |
          go test ./...
          go vet ./...

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK/NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Install gomobile
        run: |
          go get golang.org/x/mobile@latest
          go get -tool golang.org/x/mobile/cmd/gobind@latest
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Build AuronQ Go bridge AAR
        run: |
          mkdir -p android/app/libs
          gomobile bind -target=android/arm64 -androidapi 26 -javapkg com.auronq.mobilebind -o android/app/libs/auronqmobile.aar ./mobile/bridge

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Android APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk AuronQ-Mobile-0.1.0-alpha.apk
          sha256sum AuronQ-Mobile-0.1.0-alpha.apk > AuronQ-Mobile-0.1.0-SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AuronQ-Mobile-0.1.0-alpha
          path: |
            AuronQ-Mobile-0.1.0-alpha.apk
            AuronQ-Mobile-0.1.0-SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v0.1.0-alpha
          target_commitish: main
          name: AuronQ Mobile 0.1.0 Alpha
          prerelease: true
          make_latest: false
          body: |
            First Android alpha of the AuronQ Mainnet wallet.

            Features:
            - compatible encrypted AuronQ wallet files;
            - local ML-DSA-87 transaction signing using the same Go implementation as desktop;
            - import/export backup;
            - Mainnet node discovery through the official bootstrap manifest;
            - balance, receive address and send transaction;
            - Network ID verification before node use.

            This is a test APK, debug-signed by GitHub Actions. It is not a full node and has not received an independent security audit. Do not use substantial value.
          files: |
            AuronQ-Mobile-0.1.0-alpha.apk
            AuronQ-Mobile-0.1.0-SHA256SUMS.txt
