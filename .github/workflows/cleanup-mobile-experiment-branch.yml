# Retired destructive workflow (12 October 2026).
# The old implementation could delete a mobile experiment branch.
# Preserve its history as evidence; do not automatically delete git refs.
name: Retired experiment branch cleanup — safe record only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm destructive branch cleanup is disabled
        run: |
          echo "Automatic git branch deletion is retired."
          echo "Historical branches can be reviewed without deletion."
