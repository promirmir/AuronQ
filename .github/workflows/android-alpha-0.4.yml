name: Publish AuronQ Mobile 0.4.0 Alpha

on:
  push:
    branches: [main]
    paths:
      - '.release/android-0.4.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Test AuronQ Go code
        run: |
          go test ./...
          go vet ./...

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK/NDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Install gomobile
        run: |
          go get golang.org/x/mobile@latest
          go get -tool golang.org/x/mobile/cmd/gobind@latest
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Build AuronQ Go bridge AAR
        run: |
          mkdir -p android/app/libs
          gomobile bind -target=android/arm64 -androidapi 26 -javapkg com.auronq.mobilebind -o android/app/libs/auronqmobile.aar ./mobile/bridge

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Android APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk AuronQ-Mobile-0.4.0-alpha.apk
          sha256sum AuronQ-Mobile-0.4.0-alpha.apk > AuronQ-Mobile-0.4.0-SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AuronQ-Mobile-0.4.0-alpha
          path: |
            AuronQ-Mobile-0.4.0-alpha.apk
            AuronQ-Mobile-0.4.0-SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v0.4.0-alpha
          target_commitish: main
          name: AuronQ Mobile 0.4.0 Alpha
          prerelease: true
          make_latest: false
          body: |
            AuronQ Mobile 0.4.0 Alpha.

            Changes:
            - transaction history inside the Wallet screen;
            - received, sent, mining and genesis entries with status, amount, block, timestamp, confirmations and TXID;
            - history refreshes only when chain height or mempool state changes;
            - local keys and ML-DSA-87 signing remain on the phone;
            - existing resilient public-node discovery and failover are retained.

            Wallet history requires an AuronQ full node that exposes the 1.7.4 history API. Balance, sending and existing network telemetry remain compatible with the established Mainnet protocol.

            This is a debug-signed alpha APK and has not received an independent security audit. Do not use substantial value.
          files: |
            AuronQ-Mobile-0.4.0-alpha.apk
            AuronQ-Mobile-0.4.0-SHA256SUMS.txt
