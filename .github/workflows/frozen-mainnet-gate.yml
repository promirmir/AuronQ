name: Frozen Mainnet source guard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frozen-mainnet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frozen-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Reject unreviewed changes to frozen Mainnet and wallet sources
        shell: bash
        run: |
          set -euo pipefail
          # Maintenance exception #191 accepted release-packaging/UI correction through:
          # 5163e07ac5c0148e83745e6fffed7da69a3aeb74
          BASE=5163e07ac5c0148e83745e6fffed7da69a3aeb74
          git cat-file -e "$BASE^{commit}"
          changed="$(git diff --name-only "$BASE" HEAD -- \
            internal/auronq/ \
            mobile/bridge/ \
            android/app/src/main/java/com/auronq/mobile/ \
            android/app/src/main/AndroidManifest.xml \
            android/app/src/main/res/drawable/ic_auronq.xml \
            android/app/build.gradle \
            go.mod go.sum \
            network.json genesis.json \
            cmd/auronq/main.go cmd/auronq-desktop/main.go \
            .github/workflows/ci.yml \
            .github/workflows/release.yml)"
          if [ -n "$changed" ]; then
            # Owner-requested Android 0.5.8 fast-balance/logo maintenance exception.
            # This is an exact reviewed blob allowlist, NOT a blanket carve-out:
            # edits to core consensus, signing, wallet serialization, network
            # identity, or any future unapproved change still fail closed.
            while IFS= read -r file; do
              case "$file" in
                android/app/src/main/java/com/auronq/mobile/MainActivity.java)
                  expected=2ff6a732e08b677d5975000694116704b3ccd0d2 ;;
                android/app/build.gradle)
                  expected=264464cbde675b969212e3b3db207c1453e58a51 ;;
                android/app/src/main/AndroidManifest.xml)
                  expected=db1adae34a81a4063275d135391eebdacb6ab80c ;;
                android/app/src/main/res/drawable/ic_auronq.xml)
                  expected=d80e0b17dd4e5bc706ca55e2d411d7e55775852b ;;
                mobile/bridge/bridge.go)
                  expected=16e07c1cca6cbbbafe2e8a5fbfb193cb9b95b42a ;;
                mobile/bridge/bridge_test.go)
                  expected=3d86fa0d6ba9a20cea54ab0746966a448e2c01af ;;
                *)
                  echo "::error::Unapproved frozen AuronQ source change: $file"
                  exit 1 ;;
              esac
              actual="$(git rev-parse "HEAD:$file")"
              if [ "$actual" != "$expected" ]; then
                echo "::error::Frozen-path file differs from reviewed Android maintenance exception: $file"
                exit 1
              fi
            done <<< "$changed"
            echo "Only the exact pinned Android 0.5.8 maintenance blobs differ from baseline."
          else
            echo "Frozen Mainnet source is byte-for-byte unchanged."
          fi
          echo "Consensus/wallet source policy checked; immutable Mainnet identity is separately tested."
      - name: Verify immutable public Mainnet identity
        run: go test ./internal/auronq -run '^TestMainnetIdentityIsFrozen$' -count=1 -timeout=4m
