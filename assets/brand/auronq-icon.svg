<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">AuronQ icon</title>
  <desc id="desc">A stylized A and quantum-wave Q motif for AuronQ.</desc>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.42" stop-color="#dce7ff"/>
      <stop offset="0.72" stop-color="#9fb8f5"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="quantum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e7ff"/>
      <stop offset="0.48" stop-color="#256dff"/>
      <stop offset="1" stop-color="#a24cff"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#78f4ff"/>
      <stop offset="0.58" stop-color="#446cff"/>
      <stop offset="1" stop-color="#8d45ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="512" cy="500" r="318" fill="none" stroke="url(#quantum)" stroke-width="10" opacity="0.42"/>
  <circle cx="512" cy="500" r="282" fill="none" stroke="#67dfff" stroke-width="3" stroke-dasharray="8 20" opacity="0.34"/>
  <path d="M512 100 L172 742 H322 L512 382 L702 742 H852 Z"
        fill="url(#metal)" stroke="#6aa8ff" stroke-width="4"/>
  <path d="M181 740 C325 610 410 570 510 627 C635 699 747 768 884 657"
        fill="none" stroke="url(#quantum)" stroke-width="82"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M181 740 C325 610 410 570 510 627 C635 699 747 768 884 657"
        fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="18"
        stroke-linecap="round"/>
  <line x1="512" y1="208" x2="512" y2="854" stroke="#5feeff" stroke-width="6" opacity="0.52" filter="url(#glow)"/>
  <circle cx="512" cy="500" r="58" fill="url(#core)" filter="url(#glow)"/>
  <circle cx="512" cy="500" r="16" fill="#ffffff"/>
  <circle cx="512" cy="182" r="10" fill="#7cf5ff"/>
  <circle cx="830" cy="500" r="9" fill="#776dff"/>
  <circle cx="512" cy="818" r="10" fill="#7cf5ff"/>
  <circle cx="194" cy="500" r="9" fill="#776dff"/>
</svg>