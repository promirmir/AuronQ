plugins {
    id 'com.android.application'
}

android {
    namespace 'com.auronq.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.auronq.mobile'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '0.5.4-alpha'
        manifestPlaceholders = [appLabel: 'AuronQ Mobile']
    }

    buildTypes {
        debug {
            minifyEnabled false
        }

        // Separate installable diagnostic build. It uses a different package
        // ID, so it cannot replace or erase a user's existing wallet/data.
        syncprobe {
            initWith debug
            applicationIdSuffix '.syncprobe'
            versionNameSuffix '-network-test'
            signingConfig signingConfigs.debug
            manifestPlaceholders = [appLabel: 'AuronQ Mobile (Network Test)']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation files('libs/auronqmobile.aar')
}
