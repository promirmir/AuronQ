plugins {
    id 'com.android.application'
}

android {
    namespace 'com.auronq.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.auronq.mobile'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0-alpha'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation files('libs/auronqmobile.aar')
}
