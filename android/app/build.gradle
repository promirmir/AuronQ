plugins {
    id 'com.android.application'
}

android {
    namespace 'com.auronq.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.auronq.mobile'
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName '0.5.8-alpha'
        manifestPlaceholders = [appLabel: 'AuronQ Mobile']
    }

    buildTypes {
        debug {
            minifyEnabled false
        }

        // A dedicated side-by-side build protects both the real wallet and
        // earlier syncprobe installations, even when debug signing keys differ.
        autocp {
            initWith debug
            applicationIdSuffix '.autocp'
            versionNameSuffix '-checkpoint-test'
            signingConfig signingConfigs.debug
            manifestPlaceholders = [appLabel: 'AuronQ Mobile (Auto CP Test)']
        }

        // Independent P2P-checkpoint preview app. Never touches existing
        // production, syncprobe, autocp or other test wallets.
        p2pcheck {
            initWith debug
            applicationIdSuffix '.p2pcheck'
            versionNameSuffix '-separate-test'
            signingConfig signingConfigs.debug
            manifestPlaceholders = [appLabel: 'AuronQ Mobile (P2P Checkpoints)']
        }

        // Separate installable diagnostic build. It uses a different package
        // ID, so it cannot replace or erase a user's existing wallet/data.
        syncprobe {
            initWith debug
            applicationIdSuffix '.syncprobe'
            versionNameSuffix '-network-test'
            signingConfig signingConfigs.debug
            manifestPlaceholders = [appLabel: 'AuronQ Mobile (Network Test)']
        }

        // Fast, observable peer-balance repair with the official brand logo.
        // Separate application identity protects funded 0.5.6/0.5.7 installs.
        fast058 {
            initWith debug
            applicationIdSuffix '.fast058'
            versionNameSuffix '-fast-balance'
            signingConfig signingConfigs.debug
            manifestPlaceholders = [appLabel: 'AuronQ Mobile 0.5.8']
        }

        // Official 0.5.7 alpha maintenance candidate. It intentionally installs
        // side by side so a different CI debug certificate cannot overwrite or
        // strand an existing funded wallet.
        runtime057 {
            initWith debug
            applicationIdSuffix '.runtime057'
            versionNameSuffix '-runtime-independence'
            signingConfig signingConfigs.debug
            manifestPlaceholders = [appLabel: 'AuronQ Mobile 0.5.7']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation files('libs/auronqmobile.aar')
}
