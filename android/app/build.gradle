plugins {
    id 'com.android.application'
}

android {
    namespace 'com.auronq.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.auronq.mobile'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '0.5.3-fast-alpha'
        manifestPlaceholders = [appLabel: 'AuronQ Mobile']
    }

    buildTypes {
        debug {
            minifyEnabled false
        }

        // New fresh-install test; never touches old 0.5.3/0.5.5 wallets.
        fast053parallel {
            initWith debug
            applicationIdSuffix '.fast053parallel'
            versionNameSuffix '-parallel-verification-test'
            signingConfig signingConfigs.debug
            manifestPlaceholders = [appLabel: 'AuronQ 0.5.3 Fast Verify TEST']
        }

        // Test package is independent of any existing AuronQ wallet.
        // Never require users to uninstall a funded app to try this version.
        fast053 {
            initWith debug
            applicationIdSuffix '.fast053'
            versionNameSuffix '-isolated-test'
            signingConfig signingConfigs.debug
            manifestPlaceholders = [appLabel: 'AuronQ Mobile 0.5.3 Fast TEST']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation files('libs/auronqmobile.aar')
}
